<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
  <script src="../src/juris.js"></script>
</head>
<body>
	<div id="app"></div>
	<script>

	const Switch = (context) =>[
		{button:{text:'Click Me', onclick:()=>{
			context.setState('count', context.getState('count',0)+1)
		}}}
	]
	const Counter = (context)=>{
		return {
			render:()=>'Count is'+context.getState('count',0),	
			api:{},
			hooks:{}
		}	
	}
	const ControlFlow = (props) =>props.comps[props.step];

	const juris = new Juris({
			components:{
				Counter,
				Switch,
				ControlFlow
			},
		layout:[
			{Counter:{}},
			{Switch:{}},
			{ControlFlow:{
				comps:{'count':{Counter:{}}},
				step:'count',
			}}
		]
	});
	juris.render();
	</script>
</body>
</html>
