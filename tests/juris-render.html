<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
  <script src="../src/juris.js"></script>
</head>
<body>
	<div id="app"></div>
	<script>

	const Switch = (context) =>[
		{button:{text:'Click Me', onclick:()=>{
			context.setState('count', context.getState('count',0)+1)
		}}}
	]
	const Counter = (props,context)=>{
		return {
			render:()=>props.label+'-' +context.getState('count',0),	
			api:{},
			hooks:{}
		}	
	}
	const ControlFlow = (props) =>{
	return {
		render:()=>props.comps[props.steps()],
	}}

	const juris = new Juris({
			components:{
				Counter,
				Switch,
				ControlFlow
			},
		layout:[
			{Counter:{label:'Count2'}},
			{Switch:{}},
			{ControlFlow:{
				comps:{'count':{
								Counter:{
									label:'Count3'
								}},
								'count1':{
								Counter:{
									label:'Count1'
								}}
							},
				steps:()=>{
					const step = juris.getState('count',0);
						const map = {
							0:'count',
							1:'count1',
						}
						return map[step]||'count';
					}
				},
			}
		]
	});
	juris.render();
	</script>
</body>
</html>
