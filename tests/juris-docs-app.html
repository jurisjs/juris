    <script>
        // Monaco Editor Management
        let monacoEditor = null;
        let monacoLoaded = false;
        let editorContainerCounter = 0;
        let pendingCodeLoad = null;
        let isEditorReady = false;

        function createUniqueEditorContainer() {
            const baseContainer = document.getElementById('monaco-editor-base');
            if (!baseContainer) return null;

            if (monacoEditor && isEditorReady && baseContainer.children.length > 0) {
                return baseContainer.children[0];
            }

            baseContainer.innerHTML = '';
            
            const uniqueContainer = document.createElement('div');
            uniqueContainer.id = 'monaco-' + (++editorContainerCounter);
            uniqueContainer.style.cssText = 'width: 100%; height: 100%;';
            baseContainer.appendChild(uniqueContainer);
            
            return uniqueContainer;
        }

        function disposeMonacoEditor() {
            if (monacoEditor) {
                try {
                    monacoEditor.dispose();
                } catch (e) {
                    console.warn('Monaco dispose error:', e);
                }
                monacoEditor = null;
                isEditorReady = false;
            }
        }

        function createMonacoEditor() {
            disposeMonacoEditor();
            
            const container = createUniqueEditorContainer();
            if (!container) return;

            if (!monacoLoaded) {
                require.config({ 
                    paths: { vs: 'https://unpkg.com/monaco-editor@0.34.1/min/vs' },
                    'vs/nls': {
                        availableLanguages: {
                            '*': 'en'
                        }
                    }
                });
                require(['vs/editor/editor.main'], function () {
                    monacoLoaded = true;
                    initEditor(container);
                });
            } else {
                initEditor(container);
            }
        }

        function initEditor(container) {
            setTimeout(() => {
                try {
                    monacoEditor = monaco.editor.create(container, {
                        value: '',
                        language: 'javascript',
                        theme: 'vs-light',
                        automaticLayout: true,
                        minimap: { enabled: false },
                        fontSize: 13,
                        lineNumbers: 'on',
                        wordWrap: 'on',
                        scrollBeyondLastLine: false
                    });

                    isEditorReady = true;
                    
                    if (pendingCodeLoad) {
                        monacoEditor.setValue(pendingCodeLoad);
                        pendingCodeLoad = null;
                    } else {
                        loadCodeIntoEditor();
                    }
                } catch (error) {
                    console.error('Monaco creation error:', error);
                }
            }, 0);
        }

        function loadCodeIntoEditor(forceCode = null) {
            const currentDocId = juris.getState('currentDoc');
            const doc = docFramework.getDoc(currentDocId);
            const codeToLoad = forceCode || (doc && doc.code) || '';
            
            if (monacoEditor && isEditorReady) {
                try {
                    monacoEditor.setValue(codeToLoad);
                } catch (error) {
                    console.error('Failed to load code:', error);
                }
            } else if (codeToLoad) {
                pendingCodeLoad = codeToLoad;
            }
        }

        const docFramework = new DocumentFramework();

  category: 'State Management',
  content: 'Master the core state management APIs in Juris. getState retrieves values from the global state with automatic dependency tracking for reactivity. setState updates state values and triggers re-renders of dependent components. Both functions use dot-notation paths to access nested object properties.',

    {
      title: "getState Function Signature",
      language: "javascript",
      code: `// context.getState(path, defaultValue, track)

// Required parameter
const value = context.getState('user.name');  // Returns undefined if not found

// With default value
const name = context.getState('user.name', 'Anonymous');  // Returns 'Anonymous' if not found

// Skip reactivity tracking (for non-reactive usage)
const staticValue = context.getState('config.version', '1.0.0', false);`

// Basic usage

// Nested object updates

// With context information for middleware
context.setState('user.lastLogin', new Date(), {
  action: 'login',
  source: 'form-submit'
});

// Functional updates based on current state
const currentCount = context.getState('counter', 0);
context.setState('counter', currentCount + 1);`

    `// Reactive text that updates when state changes

      language: "javascript",
      code: `// Primitives

// Objects

  name: 'John',
  email: 'john@example.com'
});

// Arrays

// Nested updates

context.setState('user.preferences.language', 'en');

// Reading nested data

    },

    { text: "Advanced patterns with conditional updates and transformations:" },

    {
      title: "Advanced State Patterns",
      language: "javascript",
      code: `// Conditional updates
const toggleTheme = () => {
  const currentTheme = context.getState('app.theme', 'light');
  context.setState('app.theme', currentTheme === 'light' ? 'dark' : 'light');
};

// Incrementing counters safely
const incrementCounter = (amount = 1) => {
  const current = context.getState('counter', 0);
  context.setState('counter', current + amount);
};

// Array operations
const addItem = (item) => {
  const items = context.getState('items', []);
  context.setState('items', [...items, item]);
};

const removeItem = (index) => {
  const items = context.getState('items', []);
  context.setState('items', items.filter((_, i) => i !== index));
};

// Object merging
const updateUserProfile = (updates) => {
  const currentUser = context.getState('user', {});
  context.setState('user', { ...currentUser, ...updates });
};`

const TodoList = (props, context) => {
  return {
    div: {
      class: 'p-6 bg-purple-50 border border-purple-200 rounded-lg mb-4',
      children: [
        {h3: {
          class: 'text-lg font-bold text-purple-800 mb-4',
          text: 'Todo List - Array State Demo'
        }},
        {div: {
          class: 'flex gap-2 mb-4',
          children: [
            {input: {
              class: 'flex-1 px-3 py-2 border border-purple-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500',
              type: 'text',
              placeholder: 'Enter todo item...',
              value: () => context.getState('todoInput', ''),
              oninput: (e) => context.setState('todoInput', e.target.value)
            }},
            {button: {
              class: 'px-4 py-2 bg-purple-500 hover:bg-purple-600 text-white rounded transition-colors',
              text: 'Add',
              onclick: () => {
                const input = context.getState('todoInput', '');
                if (input.trim()) {
                  const todos = context.getState('todos', []);
                  const newTodo = {
                    id: Date.now(),
                    text: input.trim(),
                    completed: false
                  };
                  context.setState('todos', [...todos, newTodo]);
                  context.setState('todoInput', '');
                }
              }
            }}
          ]
        }},
        {div: {
          class: 'space-y-2 mb-4',
          children: () => {
            const todos = context.getState('todos', []);
            return todos.length ? todos.map((todo, index) => ({
              div: {
                class: \`flex items-center gap-2 p-2 bg-white rounded border \${
                  todo.completed ? 'bg-gray-50 text-gray-500' : ''
                }\`,
                children: [
                  {input: {
                    type: 'checkbox',
                    checked: todo.completed,
                    onchange: () => {
                      const todos = context.getState('todos', []);
                      const updated = todos.map(t => 
                        t.id === todo.id ? { ...t, completed: !t.completed } : t
                      );
                      context.setState('todos', updated);
                    }
                  }},
                  {span: {
                    class: todo.completed ? 'line-through flex-1' : 'flex-1',
                    text: todo.text
                  }},
                  {button: {
                    class: 'px-2 py-1 bg-red-500 hover:bg-red-600 text-white text-sm rounded transition-colors',
                    text: '×',
                    onclick: () => {
                      const todos = context.getState('todos', []);
                      context.setState('todos', todos.filter(t => t.id !== todo.id));
                    }
                  }}
                ]
              }
            })) : [{
              p: {
                class: 'text-gray-500 text-center py-4',
                text: 'No todos yet. Add some above!'
              }
            }];
          }
        }},
        {div: {
          class: 'flex gap-2',
          children: [
            {button: {
              class: 'px-3 py-2 bg-green-500 hover:bg-green-600 text-white text-sm rounded transition-colors',
              text: 'Add Sample Items',
              onclick: () => {
                const samples = ['Learn Juris', 'Build an app', 'Deploy project'];
                const todos = context.getState('todos', []);
                const newTodos = samples.map((text, i) => ({
                  id: Date.now() + i,
                  text,
                  completed: false
                }));
                context.setState('todos', [...todos, ...newTodos]);
              }
            }},
            {button: {
              class: 'px-3 py-2 bg-red-500 hover:bg-red-600 text-white text-sm rounded transition-colors',
              text: 'Clear All',
              onclick: () => context.setState('todos', [])
            }}
          ]
        }},
        {div: {
          class: 'mt-4 p-3 bg-white rounded border text-sm text-gray-600',
          children: [
            {p: {
              text: () => {
                const todos = context.getState('todos', []);
                const completed = todos.filter(t => t.completed).length;
                return \`Total: \${todos.length} | Completed: \${completed} | Remaining: \${todos.length - completed}\`;
              }
            }}
          ]
        }}
      ]
    }
  };
};

const TodoList = (props, context) => {
  const [todos, setTodos] = context.newState('todos', []);
  const [newTodo, setNewTodo] = context.newState('newTodo', '');
  
  const addTodo = () => {
    if (newTodo().trim()) {
      const todo = {
        id: Date.now(),
        text: newTodo().trim(),
        completed: false
      };
      setTodos([...todos(), todo]);
      setNewTodo('');
    }
  };
  
  const toggleTodo = (id) => {
    setTodos(todos().map(todo => 
      todo.id === id ? { ...todo, completed: !todo.completed } : todo
    ));
  };
  
  const deleteTodo = (id) => {
    setTodos(todos().filter(todo => todo.id !== id));
  };
  
  return {
    div: {
      class: 'p-6 bg-green-50 border border-green-200 rounded-lg mb-4',
      children: [
        {h3: {
          class: 'text-lg font-bold text-green-800 mb-4',
          text: 'Todo List with Array State'
        }},
        {div: {
          class: 'flex gap-2 mb-4',
          children: [
            {input: {
              class: 'flex-1 px-3 py-2 border border-green-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500',
              type: 'text',
              placeholder: 'Add new todo...',
              value: () => newTodo(),
              oninput: (e) => setNewTodo(e.target.value),
              onkeypress: (e) => {
                if (e.key === 'Enter') addTodo();
              }
            }},
            {button: {
              class: 'px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded transition-colors',
              text: 'Add',
              onclick: addTodo
            }}
          ]
        }},
        {div: {
          class: 'space-y-2',
          children: () => {
            const todoList = todos();
            return todoList.length ? todoList.map(todo => ({
              div: {
                class: \`flex items-center gap-2 p-2 bg-white rounded border \${
                  todo.completed ? 'bg-gray-50 text-gray-500' : ''
                }\`,
                children: [
                  {input: {
                    type: 'checkbox',
                    checked: todo.completed,
                    onchange: () => toggleTodo(todo.id)
                  }},
                  {span: {
                    class: todo.completed ? 'line-through' : '',
                    text: todo.text
                  }},
                  {button: {
                    class: 'ml-auto px-2 py-1 bg-red-500 hover:bg-red-600 text-white text-sm rounded transition-colors',
                    text: '×',
                    onclick: () => deleteTodo(todo.id)
                  }}
                ]
              }
            })) : [{
              p: {
                class: 'text-gray-500 text-center py-4',
                text: 'No todos yet. Add one above!'
              }
            }];
          }
        }}
      ]
    }
  };
};

const FormBatchDemo = (props, context) => {
  const [formData, setFormData] = context.newState('formData', {
    name: '',
    email: '',
    phone: '',
    address: ''
  });
  
  const updateField = (field, value) => {
    setFormData({
      ...formData(),
      [field]: value
    });
  };
  
  // Submit with batch for all validations and updates
  const handleSubmit = () => {
    const data = formData();
    
    context.executeBatch(() => {
      // Validate and update multiple states atomically
      context.setState('form.isSubmitting', true);
      context.setState('form.errors', {});
      
      // Simulate validation
      const errors = {};
      if (!data.name) errors.name = 'Name is required';
      if (!data.email) errors.email = 'Email is required';
      
      if (Object.keys(errors).length > 0) {
        context.setState('form.errors', errors);
        context.setState('form.isSubmitting', false);
        context.setState('form.message', 'Please fix validation errors');
      } else {
        context.setState('form.submittedData', data);
        context.setState('form.message', 'Form submitted successfully!');
        context.setState('form.isSubmitting', false);
        context.setState('form.submitCount', context.getState('form.submitCount', 0) + 1);
      }
    });
  };
  
  return {
    div: {
      class: 'p-6 bg-green-50 border border-green-200 rounded-lg mb-4',
      children: [
        {h3: {
          class: 'text-lg font-bold text-green-800 mb-4',

        {div: {

                  class: 'w-full px-3 py-2 border border-green-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500',
                  type: 'text',
                  value: () => formData().name,
                  oninput: (e) => updateField('name', e.target.value)

              children: [
                {label: { class: 'block text-sm font-medium text-green-700 mb-1', text: 'Email:' }},

                  class: 'w-full px-3 py-2 border border-green-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500',
                  type: 'email',
                  value: () => formData().email,
                  oninput: (e) => updateField('email', e.target.value)
                }}
              ]
            }},
            {div: {

                {input: {

                }}
              ]
            }}
          ]
        }},
        {div: {
          class: 'mb-4',
          children: [
            {button: {
              class: 'px-6 py-2 bg-green-500 hover:bg-green-600 text-white rounded transition-colors mr-2',
              text: () => context.getState('form.isSubmitting', false) ? 'Submitting...' : 'Submit Form',
              disabled: () => context.getState('form.isSubmitting', false),
              onclick: handleSubmit
            }},
            {button: {
              class: 'px-6 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded transition-colors',
              text: 'Reset',

                context.executeBatch(() => {

                  context.setState('form.errors', {});

const LocalStorageSync = (props, context) => {
  const [syncStatus, setSyncStatus] = context.newState('syncStatus', 'idle');
  
  // Setup localStorage sync subscription
  const setupSync = () => {
    // Subscribe to settings changes and sync to localStorage
    const unsubscribe = context.subscribe('settings', (newSettings) => {
      setSyncStatus('syncing');
      try {
        localStorage.setItem('juris-settings', JSON.stringify(newSettings));
        setSyncStatus('synced');
        setTimeout(() => setSyncStatus('idle'), 1000);
      } catch (error) {
        console.error('LocalStorage sync failed:', error);
        setSyncStatus('error');
      }
    });
    
    // Load initial settings from localStorage
    try {
      const saved = localStorage.getItem('juris-settings');
      if (saved) {
        const settings = JSON.parse(saved);
        context.setState('settings', settings);
      }
    } catch (error) {
      console.error('Failed to load settings:', error);

    return unsubscribe;

      // Add breadcrumb link

        a: {
          href: crumb.href,
          class: \`hover:text-blue-600 transition-colors \${
            index === breadcrumbs.length - 1 
              ? 'text-gray-800 font-semibold' 
              : 'text-blue-500'

          onclick: (e) => {

      // Add separator except for last item

        elements.push({
          span: {
            class: 'mx-2 text-gray-400',
            text: '/'
          }//separator
        });
      }
    });
    
    return elements;
  };

            : 'bg-red-100 text-red-800'
        }\`,
        children: [
          {span: { text: isOnline ? '●' : '●', class: 'text-xs' }},
          {span: { text: isOnline ? 'Online' : 'Offline' }}
        ]
      }//connection
    });
    
    // Notifications (conditional)
    if (notifications > 0) {
      indicators.push({
        div: {
          class: 'flex items-center gap-2 px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm',
          children: [
            {span: { text: '🔔' }},
            {span: { text: \`\${notifications} notification\${notifications > 1 ? 's' : ''}\` }}
          ]
        }//notifications
      });
    }
    
    // Sync status (conditional)
    if (lastSync) {
      indicators.push({
        div: {
          class: 'flex items-center gap-2 px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-sm',
          children: [
            {span: { text: '↻' }},
            {span: { text: \`Synced \${lastSync}\` }}
          ]
        }//sync
      });
    }
    
    return indicators;
  };
};

        // localStorage utilities
        function saveCurrentDoc(docId) {
            try {
                localStorage.setItem('juris-docs-current-doc', docId);
            } catch (e) {
                console.warn('Could not save to localStorage:', e);
            }
        }

        function loadCurrentDoc() {
            try {
                return localStorage.getItem('juris-docs-current-doc') || 'basic-components';
            } catch (e) {
                console.warn('Could not read from localStorage:', e);
                return 'basic-components';
            }
        }

        function saveBookmarks(bookmarks) {
            try {
                localStorage.setItem('juris-docs-bookmarks', JSON.stringify(bookmarks));
            } catch (e) {
                console.warn('Could not save bookmarks to localStorage:', e);
            }
        }

        function loadBookmarks() {
            try {
                const saved = localStorage.getItem('juris-docs-bookmarks');
                return saved ? JSON.parse(saved) : [];
            } catch (e) {
                console.warn('Could not load bookmarks from localStorage:', e);
                return [];
            }
        }

        function saveCollapsedCategories(collapsed) {
            try {
                localStorage.setItem('juris-docs-collapsed', JSON.stringify(collapsed));
            } catch (e) {
                console.warn('Could not save collapsed state:', e);
            }
        }

        function loadCollapsedCategories() {
            try {
                const saved = localStorage.getItem('juris-docs-collapsed');
                return saved ? JSON.parse(saved) : {};
            } catch (e) {
                console.warn('Could not load collapsed state:', e);
                return {};
            }
        }

                                        text: `No results found for "${query}"`
                                    }
                                }];

                                }
                            }));
                        }

                // Individual Category Component
                CategoryItem: (props, context) => {
                    const category = props.category;
                    const searchQuery = props.searchQuery || '';
                    
                    // Filter docs based on search query
                    const filteredDocs = searchQuery.trim() 
                        ? category.docs.filter(docId => {
                            const doc = docFramework.getDoc(docId);
                            if (!doc) return false;
                            
                            const searchTerm = searchQuery.toLowerCase();
                            return (
                                doc.title.toLowerCase().includes(searchTerm) ||
                                doc.description.toLowerCase().includes(searchTerm) ||
                                category.name.toLowerCase().includes(searchTerm) ||
                                (doc.tags && doc.tags.some(tag => 
                                    tag.toLowerCase().includes(searchTerm)
                                ))
                            );
                        })
                        : category.docs;

                    return {
                        div: {
                            class: () => {
                                const collapsed = context.getState('collapsedCategories');
                                return 'category' + (collapsed[category.name] ? ' collapsed' : '');
                            },
                            children: [
                                {
                                    div: {
                                        class: 'category-header',
                                        onclick: () => {
                                            const collapsed = context.getState('collapsedCategories');
                                            const newCollapsed = { ...collapsed };
                                            if (newCollapsed[category.name]) {
                                                delete newCollapsed[category.name];
                                            } else {
                                                newCollapsed[category.name] = true;
                                            }
                                            context.setState('collapsedCategories', newCollapsed);
                                            saveCollapsedCategories(newCollapsed);
                                        },
                                        children: [
                                            { 
                                                span: { 
                                                    class: 'category-icon', 
                                                    text: () => {
                                                        const collapsed = context.getState('collapsedCategories');
                                                        return collapsed[category.name] ? '▶' : '▼';

                                                    href: '#',
                                                    class: () => {
                                                        const current = context.getState('currentDoc');

                                                        context.setState('currentDoc', docId);

                                            doc.liveExample
                                        ]
                                    }
                                });
                            }
                            
                            // Add code snippet display with array support
                            if (doc.codeSnippet) {
                                const snippets = Array.isArray(doc.codeSnippet) ? doc.codeSnippet : [doc.codeSnippet];
                                
                                snippets.forEach((snippet, index) => {
                                    if (typeof snippet === 'string') {
                                        // Handle string snippet (traditional way)
                                        elements.push(createCodeSnippetBlock(snippet, index));
                                    } else if (typeof snippet === 'object' && snippet !== null) {
                                        // Handle VDOM object snippet
                                        if (snippet.title && snippet.code) {
                                            // Object with title and code
                                            elements.push(createCodeSnippetBlock(snippet.code, index, snippet.title, snippet.language || 'javascript'));
                                        } else if (snippet.text) {
                                            // Text explanation between code blocks
                                            elements.push({
                                                div: {
                                                    class: 'my-4 p-3 bg-gray-50 border-l-4 border-blue-500 rounded-r',
                                                    children: [
                                                        {
                                                            p: {
                                                                class: 'text-gray-700 text-sm font-medium',
                                                                text: snippet.text
                                                            }
                                                        }
                                                    ]
                                                }
                                            });
                                        } else if (snippet.separator) {
                                            // Visual separator
                                            elements.push({
                                                div: {
                                                    class: 'my-6 flex items-center',
                                                    children: [
                                                        { div: { class: 'flex-1 h-px bg-gray-300' } },
                                                        {
                                                            span: {
                                                                class: 'px-3 text-sm text-gray-500 bg-white',
                                                                text: snippet.separator
                                                            }
                                                        },
                                                        { div: { class: 'flex-1 h-px bg-gray-300' } }
                                                    ]
                                                }
                                            });
                                        } else {
                                            // Direct VDOM object - render as is
                                            elements.push(snippet);
                                        }
                                    }
                                });
                            }
                            
                            // Technical details section
                            if (doc.technicalDetails && Object.keys(doc.technicalDetails).length > 0) {
                                elements.push({
                                    div: {
                                        class: 'technical-details',
                                        children: [
                                            { h4: { text: 'Technical Details' } },
                                            {
                                                dl: {
                                                    children: Object.entries(doc.technicalDetails).flatMap(([key, value]) => [
                                                        { dt: { text: key } },
                                                        { dd: { text: value } }
                                                    ])
                                                }
                                            }
                                        ]
                                    }
                                });
                            }
                            
                            // Tags section
                            if (doc.tags && doc.tags.length > 0) {
                                elements.push({
                                    div: {
                                        class: 'tags',
                                        children: doc.tags.map(tag => ({
                                            span: { class: 'tag', text: tag }
                                        }))
                                    }
                                });
                            }

                            return elements;
                        }
                    }
                }),

                // Editor Component
                EditorContent: (props, context) => ({
                    div: {
                        class: 'editor-container',
                        children: [
                            {
                                div: {
                                    class: 'editor-header',
                                    children: [
                                        { span: { class: 'editor-title', text: 'JavaScript Editor' } },
                                        {
                                            div: {
                                                class: 'editor-actions',
                                                children: [
                                                    {
                                                        button: {
                                                            class: 'btn',
                                                            text: 'Reset',
                                                            onclick: () => {
                                                                const currentDocId = context.getState('currentDoc');
                                                                const doc = docFramework.getDoc(currentDocId);
                                                                if (doc && doc.code) {
                                                                    loadCodeIntoEditor(doc.code);
                                                                }
                                                            }
                                                        }
                                                    },
                                                    {
                                                        button: {
                                                            class: 'btn btn-primary',
                                                            text: 'Run Code',
                                                            onclick: () => {
                                                                if (monacoEditor && isEditorReady) {
                                                                    runCode(monacoEditor.getValue());
                                                                }
                                                            }
                                                        }
                                                    }
                                                ]
                                            }
                                        }
                                    ]
                                }
                            },
                            { div: { id: 'monaco-editor-base', class: 'monaco-editor-container' } }
                        ]
                    }
                }),

                // Content Panel Component
                ContentPanel: (props, context) => ({
                    div: {
                        class: 'panel-content',
                        children: () => {
                            const activeTab = context.getState('activeTab');
                            
                            if (activeTab === 'documentation') {
                                return [{ DocumentationContent: {} }];
                            } else {
                                return [{ EditorContent: {} }];
                            }
                        }
                    }
                }),

                // Console Output Component
                ConsoleOutput: (props, context) => ({
                    div: {
                        class: 'console-container',
                        children: [
                            {
                                div: {
                                    class: 'console-resizer'
                                }
                            },
                            {
                                div: {
                                    class: 'console-header',
                                    children: [
                                        {
                                            span: {
                                                text: 'Console Output'
                                            }
                                        },
                                        {
                                            button: {
                                                class: 'console-clear',
                                                text: 'Clear',
                                                onclick: () => {
                                                    context.setState('consoleOutput', []);
                                                }
                                            }
                                        }
                                    ]
                                }
                            },
                            {
                                div: {
                                    class: 'preview-console',
                                    children: () => {
                                        const logs = context.getState('consoleOutput', []);
                                        if (logs.length === 0) {
                                            return [{
                                                div: {
                                                    class: 'console-log',
                                                    style: 'color: #9ca3af; font-style: italic;',
                                                    text: 'Console output will appear here...'
                                                }
                                            }];
                                        }
                                        return logs.map((log, index) => {
                                        return {
                                            div: {
                                                class: 'console-log' + (log.type === 'error' ? ' console-error' : ''),
                                                text: `${log.type === 'error' ? '❌' : 'ℹ️'} ${log.message}`
                                            }
                                        }});
                                    }
                                }
                            }
                        ]
                    }
                }),

                // Preview Panel Component
                PreviewPanel: (props, context) => ({
                    div: {
                        class: 'preview-panel',
                        children: [
                            { 
                                div: { 
                                    class: 'preview-header', 
                                    text: 'Live Preview' 
                                } 
                            },
                            {
                                div: {
                                    class: 'preview-content',
                                    children: [
                                        { 
                                            div: { 
                                                id: 'demo', 
                                                class: 'preview-demo' 
                                            } 
                                        },
                                        { ConsoleOutput: {} }
                                    ]
                                }
                            }
                        ]
                    }
                }),


                // Navigation Footer Component
                NavigationFooter: (props, context) => ({
                    div: {
                        class: 'navigation-footer',
                        children: [
                            {
                                div: {
                                    class: 'navigation-content',
                                    children: () => {
                                        const currentDocId = context.getState('currentDoc');
                                        const navigation = docFramework.getNavigation(currentDocId);
                                        
                                        return [
                                            {
                                                a: {
                                                    href: navigation.previous ? '#' : undefined,
                                                    class: 'nav-link' + (navigation.previous ? '' : ' disabled'),
                                                    onclick: navigation.previous ? (e) => {
                                                        e.preventDefault();
                                                        context.setState('currentDoc', navigation.previous.id);
                                                        saveCurrentDoc(navigation.previous.id);
                                                        window.history.pushState(null, '', '#' + navigation.previous.id);
                                                    } : (e) => e.preventDefault(),
                                                    children: [
                                                        { span: { text: '← Previous' } },
                                                        { span: { text: navigation.previous ? navigation.previous.title : 'No previous page' } }
                                                    ]
                                                }
                                            },
                                            {
                                                button: {
                                                    class: 'btn share-button',
                                                    text: 'Share',
                                                    onclick: () => {
                                                        const url = window.location.origin + window.location.pathname + '#' + currentDocId;
                                                        navigator.clipboard.writeText(url).then(() => {
                                                            alert('Link copied to clipboard!');
                                                        });
                                                    }
                                                }
                                            },
                                            {
                                                a: {
                                                    href: navigation.next ? '#' : undefined,
                                                    class: 'nav-link' + (navigation.next ? '' : ' disabled'),
                                                    onclick: navigation.next ? (e) => {
                                                        e.preventDefault();
                                                        context.setState('currentDoc', navigation.next.id);
                                                        saveCurrentDoc(navigation.next.id);
                                                        window.history.pushState(null, '', '#' + navigation.next.id);
                                                    } : (e) => e.preventDefault(),
                                                    children: [
                                                        { span: { text: 'Next →' } },
                                                        { span: { text: navigation.next ? navigation.next.title : 'No next page' } }
                                                    ]
                                                }
                                            }
                                        ];
                                    }
                                }
                            }
                        ]
                    }
                }),

                // Main App Component
                DocsApp: (props, context) => ({
                    div: {
                        class: 'docs-container',
                        children: [
                            { MobileMenuToggle: {} },
                            { MobileOverlay: {} },
                            {
                                div: {
                                    class: () => {
                                        const isOpen = context.getState('mobileMenuOpen');
                                        return 'sidebar' + (isOpen ? ' mobile-open' : '');
                                    },
                                    children: [
                                        { AppHeader: {} },
                                        { SearchBox: {} },
                                        { BookmarksSection: {} },
                                        { CategoryList: {} }
                                    ]
                                }
                            },
                            {
                                div: {
                                    class: 'main-content',
                                    children: [
                                        { ContentHeader: {} },
                                        {
                                            div: {
                                                class: 'content-body',
                                                children: [
                                                    // Content panels wrapper
                                                    {
                                                        div: {
                                                            class: 'content-panels-wrapper',
                                                            children: [
                                                                {
                                                                    div: {
                                                                        class: 'content-panel',
                                                                        children: [
                                                                            { TabNavigation: {} },
                                                                            { ContentPanel: {} },                                                                            
                                                                            // Navigation footer (now centered between panels)
                                                                            { NavigationFooter: {} }
                                                                        ]
                                                                    }
                                                                },
                                                                { PreviewPanel: {} }
                                                            ]
                                                        }
                                                    },
                                                ]
                                            }
                                        }
                                    ]
                                }
                            }
                        ]
                    }
                })
            },
            layout: { DocsApp: {} }
        });

        // Helper function to create code snippet blocks
        function createCodeSnippetBlock(codeContent, index, customTitle = null, language = 'javascript') {
            const blockId = `code-block-${index}`;
            const title = customTitle || (language.charAt(0).toUpperCase() + language.slice(1));
            
            return {
                div: {
                    class: "my-6 bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm",
                    children: [
                        {
                            div: {
                                class: "flex items-center justify-between px-4 py-3 bg-gray-100 border-b border-gray-200",
                                children: [
                                    {
                                        div: {
                                            class: "flex items-center space-x-2",
                                            children: [
                                                {
                                                    div: {
                                                        class: "flex space-x-1",
                                                        children: [
                                                            { div: { class: "w-3 h-3 bg-red-400 rounded-full" } },
                                                            { div: { class: "w-3 h-3 bg-yellow-400 rounded-full" } },
                                                            { div: { class: "w-3 h-3 bg-green-400 rounded-full" } }
                                                        ]
                                                    }
                                                },
                                                {
                                                    span: {
                                                        class: "text-sm text-gray-600 font-mono ml-3",
                                                        text: title
                                                    }
                                                }
                                            ]
                                        }
                                    },
                                    {
                                        button: {
                                            class: "px-3 py-1 bg-blue-500 hover:bg-blue-600 text-white text-xs rounded transition-colors font-medium",
                                            text: "Copy Code",
                                            onclick: () => {
                                                navigator.clipboard.writeText(codeContent).then(() => {
                                                    console.log('Code copied to clipboard');
                                                    // Optional: Add visual feedback here
                                                });
                                            }
                                        }
                                    }
                                ]
                            }
                        },
                        {
                            div: {
                                class: "p-4 overflow-x-auto bg-gray-50",
                                children: [
                                    {
                                        pre: {
                                            class: "text-sm font-mono leading-relaxed text-gray-800",
                                            children: [
                                                {
                                                    code: {
                                                        class: `hljs language-${language}`,
                                                        innerHTML: () => {
                                                            if (window.hljs) {
                                                                return hljs.highlight(codeContent, { language }).value;
                                                            }
                                                            return codeContent;
                                                        }
                                                    }
                                                }
                                            ]
                                        }
                                    }
                                ]
                            }
                        }
                    ]
                }
            };
        }
        // Demo runner function
        function runCode(code) {
            const demoContainer = document.getElementById('demo');
            demoContainer.innerHTML = '';
            
            juris.setState('consoleOutput', []);
            
            try {
                const mockConsole = {
                    log: (...args) => {
                        const logs = juris.getState('consoleOutput', []);
                        juris.setState('consoleOutput', [...logs, {
                            type: 'log',
                            message: args.join(' ')
                        }]);
                    },
                    error: (...args) => {
                        const logs = juris.getState('consoleOutput', []);
                        juris.setState('consoleOutput', [...logs, {
                            type: 'error',
                            message: args.join(' ')
                        }]);
                    },                    
                    warn: (...args) => {
                        const logs = juris.getState('consoleOutput', []);
                        juris.setState('consoleOutput', [...logs, {
                            type: 'warn',
                            message: args.join(' ')
                        }]);
                    },                  
                    info: (...args) => {
                        const logs = juris.getState('consoleOutput', []);
                        juris.setState('consoleOutput', [...logs, {
                            type: 'info',
                            message: args.join(' ')
                        }]);
                    },
                };
                
                const func = new Function('console', 'Juris', code);
                func(mockConsole, Juris);
                
            } catch (error) {
                const logs = juris.getState('consoleOutput', []);
                juris.setState('consoleOutput', [...logs, {
                    type: 'error',
                    message: 'Error: ' + error.message
                }]);
            }
        }

        // Hash change handling
        function handleHashChange() {
            const hash = window.location.hash.substring(1);
            if (hash && docFramework.getDoc(hash)) {
                const currentDoc = juris.getState('currentDoc');
                if (currentDoc !== hash) {
                    juris.setState('currentDoc', hash);
                    saveCurrentDoc(hash);
                }
            }
        }

        window.addEventListener('hashchange', handleHashChange);
        window.addEventListener('load', handleHashChange);

        // Subscribe to currentDoc changes for Monaco synchronization
        juris.subscribe('currentDoc', (newDocId) => {
            if (juris.getState('activeTab') === 'editor') {
                const doc = docFramework.getDoc(newDocId);
                if (doc && doc.code) {
                    if (monacoEditor && isEditorReady) {
                        setTimeout(() => {
                            loadCodeIntoEditor(doc.code);
                        }, 0);
                    } else {
                        pendingCodeLoad = doc.code;
                        createMonacoEditor();
                    }
                }
            }
        });

        // Render the app
        juris.render('#app');
        // Console resize functionality
        let isResizing = false;
        let consoleContainer = null;
        let startY = 0;
        let startHeight = 0;

        // Initialize resize listeners after DOM is ready
        setTimeout(() => {
            const resizers = document.querySelectorAll('.console-resizer');
            
            resizers.forEach(resizer => {
                resizer.addEventListener('mousedown', initResize);
            });
            
            // Auto-scroll console to bottom when new logs are added
            juris.subscribe('consoleOutput', () => {
                setTimeout(() => {
                    const consoleEl = document.querySelector('.preview-console');
                    if (consoleEl) {
                        consoleEl.scrollTop = consoleEl.scrollHeight;
                    }
                }, 0);
            });
        }, 100);

        function initResize(e) {
            isResizing = true;
            consoleContainer = e.target.closest('.console-container');
            startY = e.clientY;
            startHeight = parseInt(document.defaultView.getComputedStyle(consoleContainer).height, 10);
            
            document.addEventListener('mousemove', doResize);
            document.addEventListener('mouseup', stopResize);
            document.body.style.cursor = 'ns-resize';
            document.body.style.userSelect = 'none';
        }

        function doResize(e) {
            if (!isResizing) return;
            
            const diff = startY - e.clientY;
            const newHeight = startHeight + diff;
            const minHeight = 80;
            const maxHeight = window.innerHeight * 0.6;
            
            if (newHeight >= minHeight && newHeight <= maxHeight) {
                consoleContainer.style.height = newHeight + 'px';
            }
        }

        function stopResize() {
            isResizing = false;
            consoleContainer = null;
            document.removeEventListener('mousemove', doResize);
            document.removeEventListener('mouseup', stopResize);
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        }
        // Run initial demo
        const initialDoc = docFramework.getDoc(juris.getState('currentDoc'));
        if (initialDoc && initialDoc.code) {
            setTimeout(() => runCode(initialDoc.code), 0);
        }
        
    </script>
