<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Juris Framework Documentation</title>
    <script src="https://unpkg.com/monaco-editor@0.34.1/min/vs/loader.js"></script>
     <link href="https://unpkg.com/tailwindcss@1.9.6/dist/tailwind.min.css" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            transition: none !important;
            animation: none !important;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #f8fafc;
            color: #1e293b;

            overflow: hidden;
        }

        .sidebar {

        .sidebar-header {

        }

        .sidebar-header h1 {

            margin-bottom: 0.5rem;
        }

        .sidebar-header .version {
            font-size: 0.875rem;

        }

        .search-container {

        .search-input {

<body>
    <div id="app"></div>

    <script src="../src/juris.js"></script>    
    <script src="../docs/juris-document.js"></script>    

    <script>
        // Monaco Editor Management
        let monacoEditor = null;
        let monacoLoaded = false;
        let editorContainerCounter = 0;
        let pendingCodeLoad = null;
        let isEditorReady = false;

        function createUniqueEditorContainer() {
            const baseContainer = document.getElementById('monaco-editor-base');
            if (!baseContainer) return null;

            if (monacoEditor && isEditorReady && baseContainer.children.length > 0) {
                return baseContainer.children[0];
            }

            baseContainer.innerHTML = '';
            
            const uniqueContainer = document.createElement('div');
            uniqueContainer.id = 'monaco-' + (++editorContainerCounter);
            uniqueContainer.style.cssText = 'width: 100%; height: 100%;';
            baseContainer.appendChild(uniqueContainer);
            
            return uniqueContainer;
        }

        function disposeMonacoEditor() {
            if (monacoEditor) {
                try {
                    monacoEditor.dispose();
                } catch (e) {
                    console.warn('Monaco dispose error:', e);
                }
                monacoEditor = null;
                isEditorReady = false;
            }
        }

        function createMonacoEditor() {
            disposeMonacoEditor();
            
            const container = createUniqueEditorContainer();
            if (!container) return;

            if (!monacoLoaded) {
                require.config({ 
                    paths: { vs: 'https://unpkg.com/monaco-editor@0.34.1/min/vs' },
                    'vs/nls': {
                        availableLanguages: {
                            '*': 'en'
                        }
                    }
                });
                require(['vs/editor/editor.main'], function () {
                    monacoLoaded = true;
                    initEditor(container);
                });
            } else {
                initEditor(container);
            }
        }

        function initEditor(container) {
            setTimeout(() => {
                try {
                    monacoEditor = monaco.editor.create(container, {
                        value: '',
                        language: 'javascript',
                        theme: 'vs-light',
                        automaticLayout: true,
                        minimap: { enabled: false },
                        fontSize: 13,
                        lineNumbers: 'on',
                        wordWrap: 'on',
                        scrollBeyondLastLine: false
                    });

                    isEditorReady = true;
                    
                    if (pendingCodeLoad) {
                        monacoEditor.setValue(pendingCodeLoad);
                        pendingCodeLoad = null;
                    } else {
                        loadCodeIntoEditor();
                    }
                } catch (error) {
                    console.error('Monaco creation error:', error);
                }
            }, 200);
        }

        function loadCodeIntoEditor(forceCode = null) {
            const currentDocId = juris.getState('currentDoc');
            const doc = docFramework.getDoc(currentDocId);
            const codeToLoad = forceCode || (doc && doc.code) || '';
            
            if (monacoEditor && isEditorReady) {
                try {
                    monacoEditor.setValue(codeToLoad);
                } catch (error) {
                    console.error('Failed to load code:', error);
                }
            } else if (codeToLoad) {
                pendingCodeLoad = codeToLoad;
            }
        }

        const docFramework = new DocumentFramework();

        // Beginner-Friendly Juris Documentation with Tailwind CSS

// 1. Your First Juris Component
docFramework.addDoc('first-component', {
    title: 'Your First Juris Component',
    category: 'Getting Started',
    description: 'Create your very first Juris component in 5 minutes.',
    content: 'A Juris component is just a function that returns an object describing what you want to show on the page. Think of it like writing HTML, but with JavaScript objects instead of tags.',
    code: `// Step 1: Create a simple component
const HelloWorld = () => {
    return {
        div: {
            class: "p-4 bg-blue-100 rounded-lg text-center",
            text: "Hello, World!"
        }
    };
};

// Step 2: Create a Juris app and tell it about your component
const app = new Juris({
    components: { HelloWorld },
    layout: { HelloWorld: {} }
});

// Step 3: Show it on the page
app.render("#demo");`,
    technicalDetails: {
        'Component Function': 'A component is just a JavaScript function that returns an object. The object describes what HTML elements you want to create.',
        'Object Structure': 'Use the HTML tag name as the key (like "div", "p", "button"). The value is another object with properties like "class", "text", and "children".',
        'Registration': 'Add your component to the "components" object when creating your Juris app. Use the same name you gave your function.',
        'Layout': 'The "layout" tells Juris which components to show when the app starts. Use {} for components that don\'t need any special data.',
        'Rendering': 'Call app.render() with a CSS selector (like "#demo") to tell Juris where to put your component on the page.'
    },
    tags: ['beginner', 'first-steps', 'components'],
    order: 1
});

// 2. Adding Buttons and Click Events
docFramework.addDoc('buttons-clicks', {
    title: 'Buttons and Click Events',
    category: 'Getting Started',
    description: 'Learn how to add buttons that do something when clicked.',
    content: 'Interactive elements like buttons are easy in Juris. Just add an "onclick" property to your button object.',
    code: `const ClickDemo = () => {
    return {
        div: {
            class: "p-6 bg-gray-50 rounded-lg text-center space-y-4",
            children: [
                {
                    h2: {
                        class: "text-2xl font-bold text-gray-800 mb-4",
                        text: "Click the Buttons!"
                    }
                },
                {
                    button: {
                        class: "px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600",
                        text: "Say Hello",
                        onclick: () => {
                            alert("Hello there!");
                        }
                    }
                },
                {
                    button: {
                        class: "px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 ml-2",
                        text: "Show Time",
                        onclick: () => {
                            alert("The time is: " + new Date().toLocaleTimeString());
                        }
                    }
                },
                {
                    button: {
                        class: "px-4 py-2 bg-purple-500 text-white rounded hover:bg-purple-600 ml-2",
                        text: "Random Number",
                        onclick: () => {
                            const randomNum = Math.floor(Math.random() * 100) + 1;
                            alert("Your random number is: " + randomNum);
                        }
                    }
                }
            ]
        }
    };
};

const app = new Juris({
    components: { ClickDemo },
    layout: { ClickDemo: {} }
});

app.render("#demo");`,
    technicalDetails: {
        'Click Events': 'Add onclick: () => { /* your code */ } to any element to make it clickable. The code inside the function runs when clicked.',
        'Arrow Functions': 'The () => syntax is a modern JavaScript way to write functions. It\'s shorter than writing function() {}.',
        'Alert Boxes': 'alert() shows a popup message. It\'s great for testing, but real apps usually update the page content instead.',
        'Children Array': 'When you want multiple elements inside a container, use "children" with an array of objects.',
        'CSS Classes': 'Tailwind classes like "hover:bg-blue-600" automatically change the button color when you hover over it.'
    },
    tags: ['beginner', 'events', 'buttons', 'interactivity'],
    order: 2
});

// 3. Working with Text Input
docFramework.addDoc('text-input', {
    title: 'Text Input and Forms',
    category: 'Getting Started',
    description: 'Get text from users with input fields and forms.',
    content: 'Input fields let users type text into your app. You can read what they typed and use it in your code.',
    code: `const GreetingForm = () => {
    return {
        div: {
            class: "p-6 bg-white rounded-lg shadow-md max-w-md mx-auto",
            children: [
                {
                    h2: {
                        class: "text-xl font-bold text-gray-800 mb-4",
                        text: "What's Your Name?"
                    }
                },
                {
                    input: {
                        type: "text",
                        placeholder: "Enter your name here...",
                        class: "w-full p-2 border border-gray-300 rounded mb-4 focus:border-blue-500 focus:outline-none",
                        id: "nameInput"
                    }
                },
                {
                    button: {
                        class: "w-full py-2 bg-blue-500 text-white rounded hover:bg-blue-600",
                        text: "Greet Me!",
                        onclick: () => {
                            // Get the text from the input field
                            const nameInput = document.getElementById('nameInput');
                            const userName = nameInput.value;
                            
                            if (userName.trim() === '') {
                                alert('Please enter your name first!');
                            } else {
                                alert('Hello, ' + userName + '! Nice to meet you!');
                            }
                        }
                    }
                },
                {
                    div: {
                        class: "mt-4 p-3 bg-gray-100 rounded text-sm text-gray-600",
                        children: [
                            {
                                p: {
                                    text: "💡 Tip: Try typing your name and clicking the button!"
                                }
                            }
                        ]
                    }
                }
            ]
        }
    };
};

const app = new Juris({
    components: { GreetingForm },
    layout: { GreetingForm: {} }
});

app.render("#demo");`,
    technicalDetails: {
        'Input Elements': 'Use type: "text" for text input, type: "email" for email, type: "number" for numbers, etc.',
        'Placeholder Text': 'The placeholder shows gray text inside the input to hint what users should type.',
        'Getting Input Values': 'Use document.getElementById() to find your input, then .value to get what the user typed.',
        'ID Attribute': 'Give your input an id so you can find it later with JavaScript.',

docFramework.addDoc('simple-lists', {

    description: 'Learn how to show lists of items like shopping lists or todo lists.',
    content: 'Most apps need to show lists of things - like a list of friends, products to buy, or tasks to complete. Juris makes this easy with JavaScript arrays.',
    code: `const SimpleList = (props, context) => {
    // Start with some example items

        'Buy groceries',
        'Walk the dog', 
        'Learn Juris',
        'Make dinner'
    ]);
    
    const [getNewItem, setNewItem] = context.newState('newItem', '');
    
    const addItem = () => {
        const item = getNewItem().trim();

            const currentItems = getItems();
            setItems([...currentItems, item]); // Add new item to the end
            setNewItem(''); // Clear the input
        }
    };
    
    const removeItem = (indexToRemove) => {
        const currentItems = getItems();
        const newItems = currentItems.filter((item, index) => index !== indexToRemove);
        setItems(newItems);
    };
    
    return {
        div: {
            class: "p-6 bg-white rounded-lg shadow-md max-w-md mx-auto",
            children: [

                                        }

                                    class: "px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600",

                {

        // localStorage utilities

                        ? category.docs.filter(docId => {
                            const doc = docFramework.getDoc(docId);
                            if (!doc) return false;
                            
                            const searchTerm = searchQuery.toLowerCase();
                            return (
                                doc.title.toLowerCase().includes(searchTerm) ||
                                doc.description.toLowerCase().includes(searchTerm) ||
                                category.name.toLowerCase().includes(searchTerm) ||
                                (doc.tags && doc.tags.some(tag => 
                                    tag.toLowerCase().includes(searchTerm)
                                ))
                            );
                        })
                        : category.docs;

                    return {
                        div: {

                                            } else {

                                                    },
                                                    text: doc.title,
                                                    onclick: (e) => {
                                                        e.preventDefault();
                                                        context.setState('currentDoc', docId);
                                                        saveCurrentDoc(docId);
                                                        window.history.pushState(null, '', '#' + docId);
                                                        createMonacoEditor();
                                                        setTimeout(() => {
                                                            if (doc.code) {
                                                                runCode(doc.code);
                                                            }
                                                        }, 0);
                                                        context.setState('mobileMenuOpen', false);
                                                    }
                                                }
                                            };
                                        }).filter(Boolean)
                                    }
                                }
                            ]
                        }
                    };
                },

                // Content Header Component
                ContentHeader: (props, context) => ({
                    div: {
                        class: 'content-header',
                        children: () => {
                            const currentDocId = context.getState('currentDoc');
                            const doc = docFramework.getDoc(currentDocId);
                            
                            if (!doc) return [{ div: { text: 'Loading...' } }];

                            return [
                                { h1: { class: 'content-title', text: doc.title } },
                                { p: { class: 'content-description', text: doc.description } }
                            ];
                        }
                    }
                }),

                // Tab Navigation Component
                TabNavigation: (props, context) => ({
                    div: {
                        class: 'panel-tabs',
                        children: [
                            {
                                div: {
                                    class: () => {
                                        const activeTab = context.getState('activeTab');
                                        return 'panel-tab' + (activeTab === 'documentation' ? ' active' : '');
                                    },
                                    text: 'Documentation',
                                    onclick: () => {
                                        context.setState('activeTab', 'documentation');
                                        disposeMonacoEditor();
                                    }
                                }
                            },
                            {
                                div: {
                                    class: () => {
                                        const activeTab = context.getState('activeTab');
                                        return 'panel-tab' + (activeTab === 'editor' ? ' active' : '');
                                    },
                                    text: 'Code Editor',
                                    onclick: () => {
                                        context.setState('activeTab', 'editor');
                                        setTimeout(() => {
                                            createMonacoEditor();
                                        }, 0);
                                    }
                                }
                            }
                        ]
                    }
                }),

                // Documentation Content Component
                DocumentationContent: (props, context) => ({
                    div: {
                        class: 'doc-content',
                        children: () => {
                            const currentDocId = context.getState('currentDoc');
                            const doc = docFramework.getDoc(currentDocId);
                            
                            if (!doc) return [{ div: { text: 'Loading...' } }];

                            const elements = [
                                { p: { text: doc.content } }
                            ];
                            
                            // Add interactive example if it exists
                            if (doc.interactiveExample) {
                                elements.push({
                                    div: {
                                        class: 'my-6 p-4 border-2 border-dashed border-blue-300 rounded-lg bg-blue-50',
                                        children: [
                                            {
                                                h4: {
                                                    class: 'text-lg font-semibold mb-3 text-blue-700',
                                                    text: 'Interactive Example:'
                                                }
                                            },
                                            doc.interactiveExample(context)
                                        ]
                                    }
                                });
                            }
                            
                            // Add static example if it exists
                            if (doc.liveExample) {
                                elements.push({
                                    div: {
                                        class: 'my-6 p-4 border-2 border-dashed border-green-300 rounded-lg bg-green-50',
                                        children: [
                                            {
                                                h4: {
                                                    class: 'text-lg font-semibold mb-3 text-green-700',
                                                    text: 'Live Example:'
                                                }
                                            },
                                            doc.liveExample
                                        ]
                                    }
                                });
                            }
                            
                            // Add code snippet display (separate from editor)
                            if (doc.codeSnippet) {
                                elements.push({
                                    div: {
                                        class: "my-6 bg-gray-900 text-gray-100 rounded-lg overflow-hidden shadow-lg",
                                        children: [
                                            {
                                                div: {
                                                    class: "flex items-center justify-between px-4 py-3 bg-gray-800 border-b border-gray-700",
                                                    children: [
                                                        {
                                                            div: {
                                                                class: "flex items-center space-x-2",
                                                                children: [
                                                                    {
                                                                        div: {
                                                                            class: "flex space-x-1",
                                                                            children: [
                                                                                { div: { class: "w-3 h-3 bg-red-500 rounded-full" } },
                                                                                { div: { class: "w-3 h-3 bg-yellow-500 rounded-full" } },
                                                                                { div: { class: "w-3 h-3 bg-green-500 rounded-full" } }
                                                                            ]
                                                                        }
                                                                    },
                                                                    {
                                                                        span: {
                                                                            class: "text-sm text-gray-300 font-mono ml-3",
                                                                            text: "JavaScript"
                                                                        }
                                                                    }
                                                                ]
                                                            }
                                                        },
                                                        {
                                                            button: {
                                                                class: "px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white text-xs rounded transition-colors font-medium",
                                                                text: "Copy Code",
                                                                onclick: () => {
                                                                    navigator.clipboard.writeText(doc.codeSnippet).then(() => {
                                                                        // Could add visual feedback here
                                                                        console.log('Code copied to clipboard');
                                                                    });
                                                                }
                                                            }
                                                        }
                                                    ]
                                                }
                                            },
                                            {
                                                div: {
                                                    class: "p-4 overflow-x-auto",
                                                    children: [
                                                        {
                                                            pre: {
                                                                class: "text-sm font-mono leading-relaxed",
                                                                children: [
                                                                    {
                                                                        code: {
                                                                            class: "language-javascript",
                                                                            text: doc.codeSnippet
                                                                        }
                                                                    }
                                                                ]
                                                            }
                                                        }
                                                    ]
                                                }
                                            }
                                        ]
                                    }
                                });
                            }
                            
                            // Technical details section
                            if (doc.technicalDetails && Object.keys(doc.technicalDetails).length > 0) {
                                elements.push({
                                    div: {
                                        class: 'technical-details',
                                        children: [
                                            { h4: { text: 'Technical Details' } },
                                            {
                                                dl: {
                                                    children: Object.entries(doc.technicalDetails).flatMap(([key, value]) => [
                                                        { dt: { text: key } },
                                                        { dd: { text: value } }
                                                    ])
                                                }
                                            }
                                        ]
                                    }
                                });
                            }
                            
                            // Tags section
                            if (doc.tags && doc.tags.length > 0) {
                                elements.push({
                                    div: {
                                        class: 'tags',
                                        children: doc.tags.map(tag => ({
                                            span: { class: 'tag', text: tag }
                                        }))
                                    }
                                });
                            }

                            return elements;
                        }
                    }
                }),

                // Editor Component
                EditorContent: (props, context) => ({
                    div: {
                        class: 'editor-container',
                        children: [
                            {
                                div: {
                                    class: 'editor-header',
                                    children: [
                                        { span: { class: 'editor-title', text: 'JavaScript Editor' } },
                                        {
                                            div: {
                                                class: 'editor-actions',
                                                children: [
                                                    {
                                                        button: {
                                                            class: 'btn',
                                                            text: 'Reset',
                                                            onclick: () => {
                                                                const currentDocId = context.getState('currentDoc');
                                                                const doc = docFramework.getDoc(currentDocId);
                                                                if (doc && doc.code) {
                                                                    loadCodeIntoEditor(doc.code);
                                                                }
                                                            }
                                                        }
                                                    },
                                                    {
                                                        button: {
                                                            class: 'btn btn-primary',
                                                            text: 'Run Code',
                                                            onclick: () => {
                                                                if (monacoEditor && isEditorReady) {
                                                                    runCode(monacoEditor.getValue());
                                                                }
                                                            }
                                                        }
                                                    }
                                                ]
                                            }
                                        }
                                    ]
                                }
                            },
                            { div: { id: 'monaco-editor-base', class: 'monaco-editor-container' } }
                        ]
                    }
                }),

                // Content Panel Component
                ContentPanel: (props, context) => ({
                    div: {
                        class: 'panel-content',
                        children: () => {
                            const activeTab = context.getState('activeTab');
                            
                            if (activeTab === 'documentation') {
                                return [{ DocumentationContent: {} }];
                            } else {
                                return [{ EditorContent: {} }];
                            }
                        }
                    }
                }),

                // Console Output Component
                ConsoleOutput: (props, context) => ({
                    div: {
                        class: 'preview-console',
                        children: () => {
                            const logs = context.getState('consoleOutput', []);
                            return logs.map((log, index) => ({
                                div: {
                                    class: 'console-log' + (log.type === 'error' ? ' console-error' : ''),
                                    text: log.message
                                }
                            }));
                        }
                    }
                }),

                // Preview Panel Component
                PreviewPanel: (props, context) => ({
                    div: {
                        class: 'preview-panel',
                        children: [
                            { div: { class: 'preview-header', text: 'Live Preview' } },
                            { div: { id: 'demo', class: 'preview-demo' } },
                            { ConsoleOutput: {} }
                        ]
                    }
                }),

                // Navigation Footer Component
                NavigationFooter: (props, context) => ({
                    div: {
                        class: 'navigation-footer',
                        children: () => {
                            const currentDocId = context.getState('currentDoc');
                            const navigation = docFramework.getNavigation(currentDocId);
                            
                            return [
                                {
                                    a: {
                                        href: navigation.previous ? '#' : undefined,
                                        class: 'nav-link' + (navigation.previous ? '' : ' disabled'),
                                        onclick: navigation.previous ? (e) => {
                                            e.preventDefault();
                                            context.setState('currentDoc', navigation.previous.id);
                                            saveCurrentDoc(navigation.previous.id);
                                            window.history.pushState(null, '', '#' + navigation.previous.id);
                                        } : (e) => e.preventDefault(),
                                        children: [
                                            { span: { text: '← Previous' } },
                                            { span: { text: navigation.previous ? navigation.previous.title : 'No previous page' } }
                                        ]
                                    }
                                },
                                {
                                    button: {
                                        class: 'btn share-button',
                                        text: 'Share',
                                        onclick: () => {
                                            const url = window.location.origin + window.location.pathname + '#' + currentDocId;
                                            navigator.clipboard.writeText(url).then(() => {
                                                alert('Link copied to clipboard!');
                                            });
                                        }
                                    }
                                },
                                {
                                    a: {
                                        href: navigation.next ? '#' : undefined,
                                        class: 'nav-link' + (navigation.next ? '' : ' disabled'),
                                        onclick: navigation.next ? (e) => {
                                            e.preventDefault();
                                            context.setState('currentDoc', navigation.next.id);
                                            saveCurrentDoc(navigation.next.id);
                                            window.history.pushState(null, '', '#' + navigation.next.id);
                                        } : (e) => e.preventDefault(),
                                        children: [
                                            { span: { text: 'Next →' } },
                                            { span: { text: navigation.next ? navigation.next.title : 'No next page' } }
                                        ]
                                    }
                                }
                            ];
                        }
                    }
                }),

                // Main App Component
                DocsApp: (props, context) => ({
                    div: {
                        class: 'docs-container',
                        children: [
                            { MobileMenuToggle: {} },
                            { MobileOverlay: {} },
                            {
                                div: {
                                    class: () => {
                                        const isOpen = context.getState('mobileMenuOpen');
                                        return 'sidebar' + (isOpen ? ' mobile-open' : '');
                                    },
                                    children: [
                                        { AppHeader: {} },
                                        { SearchBox: {} },
                                        { BookmarksSection: {} },
                                        { CategoryList: {} }
                                    ]
                                }
                            },
                            {
                                div: {
                                    class: 'main-content',
                                    children: [
                                        { ContentHeader: {} },
                                        {
                                            div: {
                                                class: 'content-body',
                                                children: [
                                                    {
                                                        div: {
                                                            class: 'content-panel',
                                                            children: [
                                                                { TabNavigation: {} },
                                                                { ContentPanel: {} }
                                                            ]
                                                        }
                                                    },
                                                    { PreviewPanel: {} }
                                                ]
                                            }
                                        },
                                        { NavigationFooter: {} }
                                    ]
                                }
                            }
                        ]
                    }
                })
            },
            layout: { DocsApp: {} }
        });

        // Demo runner function
        function runCode(code) {
            const demoContainer = document.getElementById('demo');
            demoContainer.innerHTML = '';
            
            juris.setState('consoleOutput', []);
            
            try {
                const mockConsole = {
                    log: (...args) => {
                        const logs = juris.getState('consoleOutput', []);
                        juris.setState('consoleOutput', [...logs, {
                            type: 'log',
                            message: args.join(' ')
                        }]);
                    },
                    error: (...args) => {
                        const logs = juris.getState('consoleOutput', []);
                        juris.setState('consoleOutput', [...logs, {
                            type: 'error',
                            message: args.join(' ')
                        }]);
                    }
                };
                
                const func = new Function('console', 'Juris', code);
                func(mockConsole, Juris);
                
            } catch (error) {
                const logs = juris.getState('consoleOutput', []);
                juris.setState('consoleOutput', [...logs, {
                    type: 'error',
                    message: 'Error: ' + error.message
                }]);
            }
        }

        // Hash change handling
        function handleHashChange() {
            const hash = window.location.hash.substring(1);
            if (hash && docFramework.getDoc(hash)) {
                const currentDoc = juris.getState('currentDoc');
                if (currentDoc !== hash) {
                    juris.setState('currentDoc', hash);
                    saveCurrentDoc(hash);
                }
            }
        }

        window.addEventListener('hashchange', handleHashChange);
        window.addEventListener('load', handleHashChange);

        // Subscribe to currentDoc changes for Monaco synchronization
        juris.subscribe('currentDoc', (newDocId) => {
            if (juris.getState('activeTab') === 'editor') {
                const doc = docFramework.getDoc(newDocId);
                if (doc && doc.code) {
                    if (monacoEditor && isEditorReady) {
                        setTimeout(() => {
                            loadCodeIntoEditor(doc.code);
                        }, 50);
                    } else {
                        pendingCodeLoad = doc.code;
                        createMonacoEditor();
                    }
                }
            }
        });

        // Render the app
        juris.render('#app');

        // Run initial demo
        const initialDoc = docFramework.getDoc(juris.getState('currentDoc'));
        if (initialDoc && initialDoc.code) {
            setTimeout(() => runCode(initialDoc.code), 0);
        }
    </script>
</body>
</html>
