<body>
    <div id="app"></div>    
    
    <script src="../src/juris.js"></script>
    <script>
				const DisplayCount = (props)=>({
						span:{text:props.count}
				})

				const  Counter = (props, { getState, setState }) => ({
						div: {
								children: () => [{
										DisplayCount:{count: () => `Count: ${getState('count')}` }
								}, {button: {
												text: 'Increment',
												onClick: () => setState('count', getState('count') + 1)
										}
								}]
						}
				})
        const app = new Juris({
            states: {
                count: 0
            },
            components: {
               DisplayCount,
							 Counter
            },            
            layout: {Counter:{}}
        });
        app.render('#app');
    </script>
</body>
</html>
