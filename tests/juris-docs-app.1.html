    <!-- Prism.js for syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

    <script>
        function initializeDocumentationApp() {
            // DocumentFramework class to organize and manage documentation
            class DocumentFramework {
                constructor() {
                    this.docs = new Map();
                    this.categories = new Map();
                    this.searchIndex = [];
                    this.currentDoc = null;
                    this.filteredDocs = [];
                }

                addDoc(id, doc) {
                    // Validate required fields
                    if (!doc.title || !doc.category || !doc.content) {
                        throw new Error(`Document ${id} missing required fields: title, category, content`);
                    }

                    const docData = {
                        id,
                        title: doc.title,
                        category: doc.category,
                        description: doc.description || '',
                        content: doc.content || '',
                        code: doc.code || '',
                        testCode: doc.testCode || '',
                        technicalDetails: doc.technicalDetails || {},
                        tags: doc.tags || [],
                        order: doc.order || 0
                    };

                    this.docs.set(id, docData);
                    this.updateCategory(doc.category, id);
                    this.updateSearchIndex(id, docData);
                    
                    return docData;
                }

                updateCategory(categoryName, docId) {
                    if (!this.categories.has(categoryName)) {
                        this.categories.set(categoryName, {
                            name: categoryName,
                            docs: [],
                            collapsed: false,
                            order: this.categories.size
                        });

                        
                        
                        function resetEditorCode(docId, originalCode) {
                            const editor = monacoEditors.get(docId);
                            if (editor) {
                                editor.setValue(originalCode);
                                juris.setState('demoOutput', 'Code reset to original');
                            }
                        }
                        
                        function runEditorCode(docId) {
                            const editor = monacoEditors.get(docId);
                            if (editor) {
                                const code = editor.getValue();
                                runDemo(code);
                            }
                        }
                        
                        function copyEditorCode(docId) {
                            const editor = monacoEditors.get(docId);
                            if (editor) {
                                const code = editor.getValue();
                                copyToClipboard(code);
                            }
                        }
                    }
                    
                    const category = this.categories.get(categoryName);
                    if (!category.docs.includes(docId)) {
                        category.docs.push(docId);
                        // Sort docs by order and title
                        category.docs.sort((a, b) => {
                            const docA = this.docs.get(a);
                            const docB = this.docs.get(b);
                            return docA.order - docB.order || docA.title.localeCompare(docB.title);
                        });
                    }
                }

                updateSearchIndex(id, doc) {
                    const searchableText = [
                        doc.title,
                        doc.description,
                        doc.category,
                        ...(doc.tags || []),
                        doc.content
                    ].join(' ').toLowerCase();

                    this.searchIndex.push({
                        id,
                        text: searchableText,
                        title: doc.title,
                        category: doc.category
                    });
                }

                search(query) {
                    if (!query.trim()) {
                        this.filteredDocs = Array.from(this.docs.keys());
                        return this.filteredDocs;
                    }

                    const searchTerm = query.toLowerCase();
                    const results = this.searchIndex
                        .filter(item => item.text.includes(searchTerm))
                        .map(item => item.id);

                    this.filteredDocs = results;
                    return results;
                }

                getDoc(id) {
                    return this.docs.get(id);
                }

                getAllDocs() {
                    return Array.from(this.docs.values())
                        .sort((a, b) => a.order - b.order || a.title.localeCompare(b.title));
                }

                getCategories() {
                    return Array.from(this.categories.values())
                        .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
                }

                getCategoryDocs(categoryName) {
                    const category = this.categories.get(categoryName);
                    return category ? category.docs.map(id => this.docs.get(id)) : [];
                }

                getFilteredCategories(searchQuery = '') {
                    if (!searchQuery.trim()) {
                        return this.getCategories();
                    }

                    const relevantDocs = this.search(searchQuery);
                    const relevantCategories = new Set();
                    
                    relevantDocs.forEach(docId => {
                        const doc = this.docs.get(docId);
                        if (doc) {
                            relevantCategories.add(doc.category);
                        }
                    });

                    return this.getCategories().filter(category => 
                        relevantCategories.has(category.name)
                    );
                }

                getNavigation(currentDocId) {
                    const allDocs = this.getAllDocs();
                    const currentIndex = allDocs.findIndex(doc => doc.id === currentDocId);
                    
                    return {
                        current: currentIndex,
                        total: allDocs.length,
                        previous: currentIndex > 0 ? allDocs[currentIndex - 1] : null,
                        next: currentIndex < allDocs.length - 1 ? allDocs[currentIndex + 1] : null
                    };
                }
            }

            // Initialize the documentation framework
            const docFramework = new DocumentFramework();

            // Monaco Editor Management - declare at the top level
            const monacoEditors = new Map();
            // Improved Monaco Editor cleanup function
        function cleanupMonacoEditor(docId) {
            if (monacoEditors.has(docId)) {
                const editor = monacoEditors.get(docId);
                try {
                    if (editor._jurisCleanup) {
                        editor._jurisCleanup();
                    } else {
                        // Fallback cleanup
                        const model = editor.getModel();
                        if (model) {
                            model.dispose();
                        }
                        editor.dispose();
                        monacoEditors.delete(docId);
                    }
                    console.log(`Monaco editor cleaned up for doc: ${docId}`);
                } catch (error) {
                    console.warn('Error cleaning up Monaco editor:', error);
                    // Force remove from map even if cleanup failed
                    monacoEditors.delete(docId);
                }
            }
        }

        // Cleanup all Monaco editors
        function cleanupAllMonacoEditors() {
            const editorIds = Array.from(monacoEditors.keys());
            editorIds.forEach(docId => {
                cleanupMonacoEditor(docId);
            });
        }
            // Monaco Editor Management functions - declare before components use them
            function initializeMonacoEditor(docId, initialCode) {
                // Wait for Monaco to be available
                if (typeof require === 'undefined') {
                    setTimeout(() => initializeMonacoEditor(docId, initialCode), 100);
                    return;
                }
                if (monacoEditors.has(docId)) {
                    return; // Editor already exists, don't create another
                }
                require.config({ 
                    paths: { 
                        vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' 
                    } 
                });
                
                require(['vs/editor/editor.main'], function() {
                    const container = document.getElementById(`monaco-editor-${docId}`);
                    if (!container) return;
                    
                    const theme = juris.getState('theme', 'dark');
                    const monacoTheme = theme === 'light' ? 'vs' : 'vs-dark';
                    
                    const editor = monaco.editor.create(container, {
                        value: initialCode,
                        language: 'javascript',
                        theme: monacoTheme,
                        fontSize: 13,
                        fontFamily: 'Monaco, Menlo, "Ubuntu Mono", monospace',
                        minimap: { enabled: false },
                        scrollBeyondLastLine: false,
                        wordWrap: 'on',
                        lineNumbers: 'on',
                        folding: true,
                        bracketMatching: 'always',
                        autoIndent: 'advanced',
                        formatOnPaste: true,
                        formatOnType: true,
                        tabSize: 2,
                        insertSpaces: true,
                        automaticLayout: true
                    });
                    
                    // Store editor reference
                    monacoEditors.set(docId, editor);
                    
                    // Add keyboard shortcuts
                    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => {
                        runEditorCode(docId);
                    });
                    
                    // Auto-save on content change
                    editor.onDidChangeModelContent(() => {
                        const code = editor.getValue();
                        juris.setState(`editedCode.${docId}`, code);
                    });
                    
                    // Theme change subscription
                    const themeUnsub = juris.subscribe('theme', (newTheme) => {
                        const monacoTheme = newTheme === 'light' ? 'vs' : 'vs-dark';
                        monaco.editor.setTheme(monacoTheme);
                    });
                    
                    // Store cleanup function
                    editor._jurisCleanup = () => {
                        themeUnsub();
                        editor.dispose();
                        monacoEditors.delete(docId);
                    };
                });

                            const html = `

                                            const script = document.createElement('script');
                                            script.src = 'https://unpkg.com/juris@latest/dist/juris.min.js';
                                            script.onload = function() {
                                                executeDemo();
                                            };

                                                document.getElementById('app').innerHTML = '<div style="color: red; padding: 20px;">Failed to load Juris framework</div>';

                                            try {

                                            } catch (error) {
                                                document.getElementById('app').innerHTML = \`

                        juris.setState('demoOutput', 'Failed to copy to clipboard');

                } else {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        juris.setState('demoOutput', 'Code copied to clipboard!');
                    } catch (err) {

                                                            background: '#0a0a0a',
                                                            border: '1px solid #333',
                                                            borderRadius: '4px',
                                                            overflow: 'auto'
                                                        },
                                                        innerHTML: 'Click "Run Code" to see rendered result here'
                                                    }
                                                }
                                            ]
                                        }
                                    }
                                ]
                            }
                        };
                    },

                    MonacoEditor: (props) => {
                        const { docId, code } = props;
                        
                        return {
                            div: {
                                id: `monaco-editor-${docId}`,
                                style: {
                                    height: '400px',
                                    border: '1px solid #333',
                                    borderRadius: '0 0 8px 8px'
                                },
                                children: () => {
                                    // Initialize Monaco when this reactive function first runs
                                    setTimeout(() => {
                                        if (!monacoEditors.has(docId)) {
                                            initializeMonacoEditor(docId, code);
                                        }
                                    }, 0);
                                    
                                    return []; // Return empty children
                                }
                            }
                        };
                    },

                    RenderedExample: (props) => {
                        const { doc } = props;
                        const theme = juris.getState('theme', 'dark');
                        const isLight = theme === 'light';
                        
                        return {
                            div: {
                                class: 'demo-container',
                                children: [
                                    {
                                        div: {
                                            class: 'demo-header',
                                            children: [
                                                {
                                                    span: {
                                                        text: 'Live Example'
                                                    }
                                                }
                                            ]
                                        }
                                    },
                                    {
                                        div: {
                                            class: 'demo-output',
                                            style: {
                                                padding: '20px',
                                                backgroundColor: isLight ? '#f8f9fa' : '#1a1a1a',
                                                border: isLight ? '1px solid #dee2e6' : '1px solid #333',
                                                borderRadius: '6px',
                                                minHeight: '150px'
                                            },
                                            children: () => {
                                                // Render different examples based on the doc ID
                                                switch (doc.id) {
                                                    case 'basic-components':
                                                        return [{ BasicComponentExample: {} }];
                                                    case 'state-management':
                                                        return [{ StateManagementExample: {} }];
                                                    default:
                                                        return [{
                                                            div: {
                                                                style: { 
                                                                    textAlign: 'center', 
                                                                    color: isLight ? '#6c757d' : '#666',
                                                                    padding: '40px 20px',
                                                                    fontStyle: 'italic'
                                                                },
                                                                text: 'Interactive example will be rendered here based on the documentation code.'
                                                            }
                                                        }];
                                                }
                                            }
                                        }
                                    }
                                ]
                            }
                        };
                    },

                    StateManagementExample: () => ({
                        div: {
                            style: () => {
                                const theme = juris.getState('theme', 'dark');
                                const isLight = theme === 'light';
                                return {
                                    border: '2px solid #ff6600',
                                    padding: '20px',
                                    borderRadius: '8px',
                                    textAlign: 'center',
                                    backgroundColor: isLight ? '#f8f9fa' : '#222',
                                    marginBottom: '15px'
                                };
                            },
                            children: [
                                {
                                    div: {
                                        style: { fontSize: '24px', color: '#50fa7b', marginBottom: '15px' },
                                        text: () => `Count: ${juris.getState('demoCounter', 0)}`
                                    }
                                },
                                {
                                    button: {
                                        style: {
                                            background: '#ff6600',
                                            color: '#000',
                                            border: 'none',
                                            padding: '10px 20px',
                                            borderRadius: '4px',
                                            cursor: 'pointer',
                                            fontSize: '14px',
                                            fontWeight: 'bold',
                                            marginRight: '10px'
                                        },
                                        text: 'Increment',
                                        onclick: () => {
                                            const current = juris.getState('demoCounter', 0);
                                            juris.setState('demoCounter', current + 1);
                                        }
                                    }
                                },
                                {
                                    button: {
                                        style: () => {
                                            const theme = juris.getState('theme', 'dark');
                                            const isLight = theme === 'light';
                                            return {
                                                background: isLight ? '#6c757d' : '#333',
                                                color: '#fff',
                                                border: isLight ? '1px solid #6c757d' : '1px solid #666',
                                                padding: '10px 20px',
                                                borderRadius: '4px',
                                                cursor: 'pointer',
                                                fontSize: '14px'
                                            };
                                        },
                                        text: 'Reset',
                                        onclick: () => {
                                            juris.setState('demoCounter', 0);
                                        }
                                    }
                                }
                            ]
                        }
                    }),

                    TechnicalDetails: (props) => {
                        const { doc } = props;
                        const details = doc.technicalDetails || {};
                        
                        if (Object.keys(details).length === 0) {
                            return null;
                        }
                        
                        return {
                            div: {
                                class: 'technical-details',
                                children: [
                                    {
                                        h2: {
                                            class: 'section-title',
                                            text: 'Technical Details'
                                        }
                                    },
                                    {
                                        div: {
                                            class: 'details-grid',
                                            children: Object.entries(details).map(([key, value]) => ({
                                                div: {
                                                    class: 'detail-item',
                                                    children: [
                                                        {
                                                            div: {
                                                                class: 'detail-label',
                                                                text: key
                                                            }
                                                        },
                                                        {
                                                            div: {
                                                                class: 'detail-value',
                                                                text: value
                                                            }
                                                        }
                                                    ]
                                                }
                                            }))
                                        }
                                    }
                                ]
                            }
                        };
                    }
                }
            });

            // Theme and settings management functions
            function toggleTheme(newTheme) {
                juris.setState('theme', newTheme);
                applyTheme(newTheme);
            }
            
            function setFontSize(newSize) {
                juris.setState('fontSize', newSize);
                applyFontSize(newSize);
            }
            
            function applyTheme(theme) {
                document.body.classList.remove('light-theme', 'dark-theme');
                document.body.classList.add(`${theme}-theme`);
            }
            
            function applyFontSize(size) {
                document.body.classList.remove('font-small', 'font-medium', 'font-large');
                document.body.classList.add(`font-${size}`);
            }

            // Navigation functions
            function navigateToDoc(docId) {
    const currentDoc = juris.getState('currentDoc');
    
    // Only clean up if we're switching to a DIFFERENT document
    if (currentDoc && currentDoc !== docId) {
        if (monacoEditors.has(currentDoc)) {
            const oldEditor = monacoEditors.get(currentDoc);
            oldEditor.dispose();
            monacoEditors.delete(currentDoc);
        }
    }
    
    juris.setState('currentDoc', docId);
}

            // Utility functions
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            
            function copyToClipboard(text) {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => {
                        juris.setState('demoOutput', 'Code copied to clipboard!');
                    }).catch(() => {
                        juris.setState('demoOutput', 'Failed to copy to clipboard');
                    });
                } else {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        juris.setState('demoOutput', 'Code copied to clipboard!');
                    } catch (err) {
                        juris.setState('demoOutput', 'Failed to copy to clipboard');
                    }
                    document.body.removeChild(textArea);
                }
            }

            // Set layout and initialize
            juris.layout = { DocumentationApp: {} };
            
            // Initialize from URL or default to first doc
            const hash = window.location.hash.substring(1); // Remove #
            if (hash && docFramework.getDoc(hash)) {
                juris.setState('currentDoc', hash);
            } else {
                // Default to first doc
                const firstDoc = docFramework.getAllDocs()[0];
                if (firstDoc) {
                    juris.setState('currentDoc', firstDoc.id);
                }
            }

            // Render the application
            juris.render('#app');

            // Make globals available for demo execution
            window.juris = juris;
            window.docFramework = docFramework;
            window.Juris = Juris; // Make Juris class available globally
            
            console.log('Juris Documentation initialized successfully!');
        }
    </script>
</body>
