<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juris Framework Documentation</title>
    <script src="https://unpkg.com/monaco-editor@0.34.1/min/vs/loader.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            transition: none !important;
            animation: none !important;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            height: 100vh;
            overflow: hidden;
        }

        .docs-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .sidebar-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .sidebar-header .version {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        .search-container {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }

        .search-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .navigation {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0;
        }

        .bookmarks-section {
            border-bottom: 1px solid #e2e8f0;

        }

        .bookmarks-header {
            padding: 0.75rem 1rem;
            font-weight: 600;
            font-size: 0.875rem;
            color: #374151;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .bookmark-button {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .bookmark-button:hover {

            color: #374151;

        .bookmark-button.bookmarked {

        }

        .bookmarks-list {

        .bookmark-item {
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-left: 3px solid transparent;
            font-size: 0.875rem;
        }

        .bookmark-link {
            flex: 1;
            color: #64748b;
            text-decoration: none;
            cursor: pointer;
        }

        .bookmark-link:hover {
            color: #1e293b;
        }

        .bookmark-link.active {
            color: #2563eb;
            font-weight: 500;
        }

        .bookmark-remove {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.125rem;
            border-radius: 0.25rem;

        }

        .bookmark-item:hover .bookmark-remove {

        }

        .bookmark-remove:hover {

        }

        .empty-bookmarks {

        }

        .category {

        }

        .category-header {
            padding: 0.75rem 1rem;

            font-weight: 600;
            font-size: 0.875rem;
            color: #374151;
            display: flex;
            align-items: center;

        .category-header:hover {

        .category-icon {

        }

        .content-title {
            font-size: 1.875rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .content-description {
            color: #64748b;

        }

        .content-body {
            flex: 1;
            display: flex;

        .content-panel {
            flex: 1;

            flex-direction: column;
            background: white;
            border-right: 1px solid #e2e8f0;

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid #e2e8f0;

        .panel-tab.active {

        }

        .panel-content {

        }

        .doc-content {

        .doc-content h1, .doc-content h2, .doc-content h3 {

        }

        .technical-details dt {

        }

        .technical-details dd {

        .tag {

            color: #2563eb;

        }

            display: flex;
            flex-direction: column;
            background: white;
        }

        .preview-header {
            padding: 1rem;
            background: #f8fafc;

        .preview-content {
            flex: 1;
            overflow-y: auto;
        }

        .preview-demo {

        }

        .console-error {

        .navigation-footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid #e2e8f0;
            background: white;

            justify-content: space-between;
            align-items: center;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            background: white;
            color: #374151;

        .share-button {

        /* Mobile menu toggle */
        .mobile-menu-toggle {
            display: none;

            left: 1rem;

            color: white;

            border-radius: 0.375rem;
            padding: 0.75rem;

        }

        .mobile-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;

            height: 100%;

        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .preview-panel {
                width: 300px;
            }
            
            .sidebar {
                width: 280px;
            }
        }

        @media (max-width: 768px) {
            .mobile-menu-toggle {
                display: block;
            }

            .docs-container {
                flex-direction: column;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: -320px;
                width: 320px;
                height: 100vh;
                z-index: 999;
                transform: translateX(0);
            }

            .sidebar.mobile-open {
                left: 0;
            }

            .mobile-overlay.active {
                display: block;
            }

            .main-content {
                width: 100%;
                margin-left: 0;
            }

            .content-body {
                flex-direction: column;
            }

            .preview-panel {
                width: 100%;
                order: -1;
                max-height: 300px;
            }

            .content-panel {
                order: 1;
            }

            .content-header {
                padding: 1rem;
                margin-top: 3.5rem;
            }

            .content-title {
                font-size: 1.5rem;
            }

            .panel-tabs {
                flex-wrap: wrap;
            }

            .panel-tab {
                flex: 1;
                text-align: center;
            }

            .navigation-footer {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-link {

        }

        @media (max-width: 480px) {
            .sidebar-header {
                padding: 1rem;
            }

            .sidebar-header h1 {

                padding: 0.75rem;
            }

            .content-title {
                font-size: 1.25rem;
            }

            .doc-content {
                padding: 1rem;
            }

            .panel-tab {
                padding: 0.75rem 1rem;

            }

            .editor-header {
                padding: 0.75rem;
                flex-direction: column;
                gap: 0.5rem;
            }

            .editor-actions {
                width: 100%;
                justify-content: center;
            }

            .btn {
                padding: 0.5rem 0.75rem;

            }

            .preview-console {

    </style>
</head>
<body>
    <div id="app"></div>

    <script src="../src/juris.js"></script>    
    <script src="../docs/juris-document.js"></script>    

    <script>
        // Monaco Editor Management - FIXED VERSION
        let monacoEditor = null;
        let monacoLoaded = false;
        let editorContainerCounter = 0;
        let pendingCodeLoad = null;
        let isEditorReady = false;

        function createUniqueEditorContainer() {
            const baseContainer = document.getElementById('monaco-editor-base');
            if (!baseContainer) return null;

            // Don't recreate if container already exists and Monaco is ready
            if (monacoEditor && isEditorReady && baseContainer.children.length > 0) {
                console.log('Reusing existing Monaco container');
                return baseContainer.children[0];
            }

            baseContainer.innerHTML = '';
            
            const uniqueContainer = document.createElement('div');
            uniqueContainer.id = 'monaco-' + (++editorContainerCounter);
            uniqueContainer.style.cssText = 'width: 100%; height: 100%;';
            baseContainer.appendChild(uniqueContainer);
            
            return uniqueContainer;
        }

        function disposeMonacoEditor() {
            if (monacoEditor) {
                try {
                    monacoEditor.dispose();
                } catch (e) {
                    console.warn('Monaco dispose error:', e);
                }
                monacoEditor = null;
                isEditorReady = false;
            }
        }

        function createMonacoEditor() {
            disposeMonacoEditor();
            
            const container = createUniqueEditorContainer();
            if (!container) return;

            if (!monacoLoaded) {
                require.config({ 
                    paths: { vs: 'https://unpkg.com/monaco-editor@0.34.1/min/vs' },
                    'vs/nls': {
                        availableLanguages: {
                            '*': 'en'
                        }
                    }
                });
                require(['vs/editor/editor.main'], function () {
                    monacoLoaded = true;
                    initEditor(container);
                });
            } else {
                initEditor(container);
            }
        }

        function initEditor(container) {
            setTimeout(() => {
                try {
                    monacoEditor = monaco.editor.create(container, {
                        value: '',
                        language: 'javascript',
                        theme: 'vs-light',
                        automaticLayout: true,
                        minimap: { enabled: false },
                        fontSize: 13,
                        lineNumbers: 'on',
                        wordWrap: 'on',
                        scrollBeyondLastLine: false
                    });

                    isEditorReady = true;
                    
                    // Load any pending code
                    if (pendingCodeLoad) {
                        monacoEditor.setValue(pendingCodeLoad);
                        pendingCodeLoad = null;
                    } else {
                        loadCodeIntoEditor();
                    }
                    
                    console.log('Monaco editor initialized successfully');
                } catch (error) {
                    console.error('Monaco creation error:', error);
                }
            }, 200);
        }

        function loadCodeIntoEditor(forceCode = null) {
            const currentDocId = juris.getState('currentDoc');
            const doc = docFramework.getDoc(currentDocId);
            const codeToLoad = forceCode || (doc && doc.code) || '';
            
            if (monacoEditor && isEditorReady) {
                console.log('Loading code into Monaco:', currentDocId);
                try {
                    monacoEditor.setValue(codeToLoad);
                    console.log('Code loaded successfully');
                } catch (error) {
                    console.error('Failed to load code:', error);
                }
            } else if (codeToLoad) {
                console.log('Monaco not ready, storing pending code for:', currentDocId);
                pendingCodeLoad = codeToLoad;
            }
        }

        // FIXED: Document switching handler
        function handleDocumentSwitch(newDocId, oldDocId) {
            console.log('Document switch:', oldDocId, '->', newDocId);
            
            // If editor tab is active, update the code immediately
            if (juris.getState('activeTab') === 'editor') {
                const doc = docFramework.getDoc(newDocId);
                if (doc && doc.code) {
                    loadCodeIntoEditor(doc.code);
                }
            }
        }

        const docFramework = new DocumentFramework();

        // Simple search implementation that works directly with our known documents
        const allDocuments = {
            'basic-components': {
                id: 'basic-components',
                title: 'Basic Component Creation',
                category: 'Components',
                description: 'Learn how to create and register basic Juris components using the component system.',
                content: 'Juris components are the building blocks of your application. They can be simple functions that return VDOM objects or more complex components with lifecycle methods and state management.',
                tags: ['components', 'basics', 'vdom', 'props']
            },
            'state-reactive': {
                id: 'state-reactive',
                title: 'State Management & Reactivity',
                category: 'Core Concepts',
                description: 'Understanding Juris reactive state system with automatic dependency tracking.',
                content: 'Juris provides automatic reactivity through its state management system. When you use getState() in reactive contexts, components automatically re-render when dependencies change.',
                tags: ['state', 'reactivity', 'components', 'hooks']
            }
        };

        function searchDocuments(query) {
            if (!query.trim()) return Object.values(allDocuments);
            
            const searchTerm = query.toLowerCase();
            return Object.values(allDocuments).filter(doc => 
                doc.title.toLowerCase().includes(searchTerm) ||
                doc.description.toLowerCase().includes(searchTerm) ||
                doc.content.toLowerCase().includes(searchTerm) ||
                doc.category.toLowerCase().includes(searchTerm) ||
                (doc.tags && doc.tags.some(tag => tag.toLowerCase().includes(searchTerm)))
            );
        }

        function getFilteredCategories(searchQuery) {
            const matchingDocs = searchDocuments(searchQuery);
            const categories = {};
            
            matchingDocs.forEach(doc => {
                if (!categories[doc.category]) {
                    categories[doc.category] = [];
                }
                categories[doc.category].push(doc);
            });
            
            return Object.keys(categories).map(categoryName => ({
                name: categoryName,
                docs: categories[categoryName]
            }));
        }

        docFramework.addDoc('basic-components', {
            title: 'Basic Component Creation',
            category: 'Components',
            description: 'Learn how to create and register basic Juris components using the component system.',
            content: 'Juris components are the building blocks of your application. They can be simple functions that return VDOM objects or more complex components with lifecycle methods and state management.',
            code: `const GreetingComponent = (props, context) => {
    return {
        render: () => ({
            div: {
                style: {
                    border: "2px solid #ff6600",
                    padding: "20px",
                    borderRadius: "8px",
                    textAlign: "center",
                    backgroundColor: "#f0f0f0",
                    marginBottom: "15px"
                },
                children: [
                    {
                        h2: {
                            style: { fontSize: "24px", color: "#ff6600", marginBottom: "10px" },
                            text: "Hello, Juris!"
                        }
                    },
                    {
                        p: {
                            style: { fontSize: "16px", color: "#333", margin: "0" },
                            text: "This is a complete Juris component rendered properly."
                        }
                    }
                ]
            }
        })
    };
};

const demo = new Juris({
    components: { GreetingComponent },
    layout: { GreetingComponent: {} }
});

demo.render("#demo");`,
            technicalDetails: {
                'Component Types': 'Functional, Class-based, Hooks-based',
                'Props System': 'Automatic prop injection and validation',
                'Registration': 'Global component registry with name collision detection',
                'Rendering': 'Efficient VDOM-based rendering system'
            },
            tags: ['components', 'basics', 'vdom', 'props'],
            order: 1
        });

        docFramework.addDoc('state-reactive', {
            title: 'State Management & Reactivity',
            category: 'Core Concepts',
            description: 'Understanding Juris reactive state system with automatic dependency tracking.',
            content: 'Juris provides automatic reactivity through its state management system. When you use getState() in reactive contexts, components automatically re-render when dependencies change.',
            code: `const CounterApp = (props, context) => {
    const [getCount, setCount] = context.newState("count", 0);
    const [getMessage, setMessage] = context.newState("message", "Click to increment!");
    
    return {
        render: () => ({
            div: {
                style: {
                    padding: "30px",
                    textAlign: "center",
                    border: "2px solid #3b82f6",
                    borderRadius: "12px",
                    backgroundColor: "#f8fafc",
                    fontFamily: "Arial, sans-serif"
                },
                children: [
                    {
                        h1: {
                            style: { color: "#1e293b", marginBottom: "20px" },
                            text: "Reactive Counter"
                        }
                    },
                    {
                        div: {
                            style: { 
                                fontSize: "32px", 
                                fontWeight: "bold",
                                color: "#3b82f6",
                                margin: "20px 0"
                            },
                            text: () => getCount()
                        }
                    },
                    {
                        p: {
                            style: { color: "#64748b", marginBottom: "20px" },
                            text: () => getMessage()
                        }
                    },
                    {
                        button: {
                            text: "Increment",
                            onclick: () => {
                                const newCount = getCount() + 1;
                                setCount(newCount);
                                setMessage("Count is now " + newCount + "!");
                            },
                            style: {
                                padding: "12px 24px",
                                fontSize: "16px",
                                backgroundColor: "#3b82f6",
                                color: "white",
                                border: "none",
                                borderRadius: "6px",
                                cursor: "pointer",
                                margin: "5px"
                            }
                        }
                    },
                    {
                        button: {
                            text: "Reset",
                            onclick: () => {
                                setCount(0);
                                setMessage("Counter reset!");
                            },
                            style: {
                                padding: "12px 24px",
                                fontSize: "16px",
                                backgroundColor: "#ef4444",
                                color: "white",
                                border: "none",
                                borderRadius: "6px",
                                cursor: "pointer",
                                margin: "5px"
                            }
                        }
                    }
                ]
            }
        })

        function runCode(code) {
            const demoContainer = document.getElementById('demo');
            demoContainer.innerHTML = '';
            
            juris.setState('consoleOutput', []);
            
            try {
                const mockConsole = {
                    log: (...args) => {
                        const logs = juris.getState('consoleOutput', []);
                        juris.setState('consoleOutput', [...logs, {
                            type: 'log',
                            message: args.join(' ')
                        }]);
                    },
                    error: (...args) => {
                        const logs = juris.getState('consoleOutput', []);
                        juris.setState('consoleOutput', [...logs, {
                            type: 'error',
                            message: args.join(' ')
                        }]);
                    }
                };
                
                const func = new Function('console', 'Juris', code);
                func(mockConsole, Juris);
                
            } catch (error) {
                const logs = juris.getState('consoleOutput', []);
                juris.setState('consoleOutput', [...logs, {
                    type: 'error',
                    message: 'Error: ' + error.message
                }]);
            }
        }
